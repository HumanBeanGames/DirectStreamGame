[package]
name = "DirectStreamGame"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Bevy library and tools for low-bandwidth indexed-pixel browser game streams"
repository = "https://github.com/HumanBeanGames/DirectStreamGame"
publish = false
default-run = "DirectStreamGame"

[lib]
name = "direct_stream_game"
path = "src/lib.rs"

[features]
default = []
ffmpeg-media = ["dep:ffmpeg-next"]

[dependencies]
arboard = "3.4.0"
bevy = "0.18.1"
bevy_ui_widgets = "0.18.1"
crossbeam-channel = "0.5.15"

# Dynamically link LGPL-compatible FFmpeg shared libraries. Do not enable
# ffmpeg-next's "static", "build", "build-license-gpl", or
# "build-license-nonfree" features for proprietary distribution.
ffmpeg-next = { version = "=8.1.0", optional = true, default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }
open = "5.3"
pollster = "0.4"
rfd = "0.15"
wgpu = "27.0.1"
